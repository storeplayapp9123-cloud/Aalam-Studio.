name: Build Aalam Studio APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Fix Crash - Theme Fix
        run: |
          FOLDER=$(find . -type d -name "Aalam-Studio*" | head -n 1)
          cd "$FOLDER"
          rm -rf app/src/main/java/com/aalamstudio
          rm -rf app/src/main/java/com/aalam
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/java/com/aalam/studio

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AalamStudio" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#111111</item>
                  <item name="colorPrimaryDark">#000000</item>
                  <item name="colorAccent">#D4AF37</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#111111" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#D4AF37" android:pathData="M54,30L70,54L54,78L38,54Z"/>
          </vector>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:gravity="center"
              android:orientation="vertical"
              android:background="#111111">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Aalam Studio - FINAL BUILD!"
                  android:textColor="#D4AF37"
                  android:textSize="24sp"
                  android:textStyle="bold"/>
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:text="Ab crash nahi hoga!"
                  android:textColor="#FFFFFF"
                  android:textSize="16sp"/>
          </LinearLayout>
          EOF

          cat > app/src/main/java/com/aalam/studio/MainActivity.java <<'EOF'
          package com.aalam.studio;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="true" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher" android:label="Aalam Studio" android:theme="@style/Theme.AalamStudio">
                  <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          FOLDER=$(find . -type d -name "Aalam-Studio*" | head -n 1)
          cd "$FOLDER"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AalamStudio-debug-FINAL
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
