name: Build Aalam Studio APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          echo "Finding build.gradle..."
          find . -name "build.gradle" -type f
          # Jo folder mile usme chale jao
          APP_DIR=$(dirname $(find . -name "build.gradle" | grep app | head -n 1))
          echo "Building in $APP_DIR"
          cd $APP_DIR/..
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AalamStudio-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
