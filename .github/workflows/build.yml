name: Build Aalam Studio APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Fix Crash - Theme Fix
        run: |
          FOLDER=$(find . -type d -name "Aalam-Studio*" | head -n 1)
          cd "$FOLDER"
          echo "Fixing in $FOLDER"

          # 1. ROOT build.gradle FIX - ye sabse important hai
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'com.android.library' version '8.2.2' apply false
          }
          task clean(type: Delete) { delete rootProject.buildDir }
          EOF

          # 2. settings.gradle FIX
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Aalam-Studio"
          include ':app'
          EOF

          # 3. APP FIX
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.aalam.studio'
              compileSdk 34
              defaultConfig {
                  applicationId "com.aalam.studio"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          rm -rf app/src/main/java/com/aalamstudio
          rm -rf app/src/main/java/com/aalam
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/java/com/aalam/studio

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AalamStudio" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#111111</item>
                  <item name="colorAccent">#D4AF37</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#111111" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#D4AF37" android:pathData="M54,30L70,54L54,78L38,54Z"/>
          </vector>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:gravity="center" android:orientation="vertical" android:background="#111111">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Aalam Studio" android:textColor="#D4AF37" android:textSize="28sp" android:textStyle="bold"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="10dp" android:text="Crash Fixed Version" android:textColor="#FFFFFF" android:textSize="16sp"/>
          </LinearLayout>
          EOF

          cat > app/src/main/java/com/aalam/studio/MainActivity.java <<'EOF'
          package com.aalam.studio;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="true" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher" android:label="Aalam Studio" android:theme="@style/Theme.AalamStudio">
                  <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          FOLDER=$(find . -type d -name "Aalam-Studio*" | head -n 1)
          cd "$FOLDER"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AalamStudio-CrashFixed
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
